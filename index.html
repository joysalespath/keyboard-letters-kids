<html>
  <title>Keyboard Letters Game</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  html, body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
  }
  body {
      background: DARKGREY;
      font-family: Verdana, Helvetica, Arial, sans-serif;
  }
  span.letter {
      font-size: 16em;
      font-weight: bold;
      /*text-shadow: 8px 8px 11px rgba(150, 150, 150, 0.74);*/
      text-shadow: -5px 0 black, 0 5px black, 5px 0 black, 0 -5px black;
      z-index:-99;
  }
  span.image {
      border: solid black 5px;
      background: WHITE;
      z-index:-99;
  }
  /* Three bordered panels across the screen */
  #panels {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      z-index: 1;
  }
  .panel {
      flex: 1;
      border: 4px solid black;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
  }
  .panel .emoji {
      font-size: 22vh;
      line-height: 1;
  }
  .panel .label {
      position: absolute;
      bottom: 10px;
      font-size: 4vh;
      font-weight: bold;
      color: #333;
  }
  #instructions {
      font-size: 1.2em;
      color: WHITE;
      padding:20px;
      text-align:center;
  }
  select {
      background: DARKGREY;
      border:1px #444444 solid;
  }
  #settingsPanel {
      background: DARKGREY;
      z-index:99;
      position: absolute;
      right:8px;
      bottom:8px;
      padding:2px;
      font-size:0.8em;
  }
  #infoAndCredits {
      z-index:99;
      position: absolute;
      left:8px;
      bottom:8px;
      padding:2px;
      font-size:0.8em;
  }
  #credits {
      font-size:0.7em;
  }|
  </style>
  <script>
    var allLetters = '';
    var allElements = [];
    var keyheld = false;
    var voice = null;
    var voices = null;
    var mode = null;
    var timer = null;
    var panelIndex = 0;   // which panel to fill next: 0=left, 1=middle, 2=right, then back to 0

    // Simple, lightweight, offline emoji "images" — one per letter. No network, nothing to break.
    var words = {
        "A": { word: "Apple",     emoji: "\uD83C\uDF4E" },
        "B": { word: "Ball",      emoji: "\u26BD" },
        "C": { word: "Cat",       emoji: "\uD83D\uDC31" },
        "D": { word: "Dog",       emoji: "\uD83D\uDC36" },
        "E": { word: "Elephant",  emoji: "\uD83D\uDC18" },
        "F": { word: "Fish",      emoji: "\uD83D\uDC1F" },
        "G": { word: "Grapes",    emoji: "\uD83C\uDF47" },
        "H": { word: "Horse",     emoji: "\uD83D\uDC0E" },
        "I": { word: "Ice cream", emoji: "\uD83C\uDF66" },
        "J": { word: "Juice",     emoji: "\uD83E\uDDC3" },
        "K": { word: "Kangaroo",  emoji: "\uD83E\uDD98" },
        "L": { word: "Lion",      emoji: "\uD83E\uDD81" },
        "M": { word: "Monkey",    emoji: "\uD83D\uDC12" },
        "N": { word: "Nest",      emoji: "\uD83E\uDEB9" },
        "O": { word: "Octopus",   emoji: "\uD83D\uDC19" },
        "P": { word: "Parrot",    emoji: "\uD83E\uDD9C" },
        "Q": { word: "Queen",     emoji: "\uD83D\uDC51" },
        "R": { word: "Rabbit",    emoji: "\uD83D\uDC30" },
        "S": { word: "Sun",       emoji: "\u2600\uFE0F" },
        "T": { word: "Turtle",    emoji: "\uD83D\uDC22" },
        "U": { word: "Umbrella",  emoji: "\u2602\uFE0F" },
        "V": { word: "Volcano",   emoji: "\uD83C\uDF0B" },
        "W": { word: "Whale",     emoji: "\uD83D\uDC33" },
        "X": { word: "Xylophone", emoji: "\uD83C\uDFB9" },
        "Y": { word: "Yo yo",     emoji: "\uD83E\uDE80" },
        "Z": { word: "Zebra",     emoji: "\uD83E\uDD93" }
    };

    // Numbers 0-9: show the digit plus a matching count of dots, and say the number name.
    var numbers = {
        "0": { word: "Zero",  emoji: "\u2B55" },
        "1": { word: "One",   emoji: "1\uFE0F\u20E3" },
        "2": { word: "Two",   emoji: "2\uFE0F\u20E3" },
        "3": { word: "Three", emoji: "3\uFE0F\u20E3" },
        "4": { word: "Four",  emoji: "4\uFE0F\u20E3" },
        "5": { word: "Five",  emoji: "5\uFE0F\u20E3" },
        "6": { word: "Six",   emoji: "6\uFE0F\u20E3" },
        "7": { word: "Seven", emoji: "7\uFE0F\u20E3" },
        "8": { word: "Eight", emoji: "8\uFE0F\u20E3" },
        "9": { word: "Nine",  emoji: "9\uFE0F\u20E3" }
    };

    var animals = {
        'CAT': 'mee-ow!',
        'DOG': 'woof!',
        'COW': 'moo!',
        'FROG': 'croak',
        'BEE': 'buzz',
        'TURKEY': 'gobble!',
        'PIG': 'oink!',
        'SHEEP': 'baa!'
    };

    function init() {
        initMode();

        timer = setInterval(function() {
            voices = speechSynthesis.getVoices();
            if (voices.length !== 0) {
                voice = setVoice();
                clearInterval(timer);
            }
        }, 200);
    }
    window.speechSynthesis.onvoiceschanged = function() {
        voice = setVoice();
    };

    document.onkeyup = function(e) {
        keyheld = false;
    }

    document.onkeypress = function(e) {
        e = e || window.event;
        var charCode = (typeof e.which == "number") ? e.which : e.keyCode;
        if (charCode && !keyheld) {
            var text = String.fromCharCode(charCode).toUpperCase();
            doLetter(text);
        }
    };

    function doLetter(letter) {
        document.getElementById('instructions').style.display = 'none';
        text = letter;

        if (mode=='words' || mode=='letter-is-for-word') {
            wordData = words[letter];
            if (wordData) {
                text = wordData.word;   // say just the word (e.g. "Apple") so fast typing stays snappy
                showEmoji(wordData.emoji, letter + " " + wordData.word);
            }
            // Numbers: show the digit in a panel and say its name
            var numData = numbers[letter];
            if (numData) {
                text = numData.word;
                showEmoji(numData.emoji, letter + " " + numData.word);
            }
        }

        if (letter == "=") text="equals";
        if (letter == "+") text="plus";
        if (letter == "-") text="minus";

        var mid_sum = (allLetters.length>0 && allLetters[allLetters.length-1].match(/\d/))
        if ((letter == "X" || letter == "*") && mid_sum) { text="times"; letter = "x" }
        if ((letter == "/" || letter == "÷") && mid_sum) { text="divided by"; letter = "÷" }

        say(text.toLowerCase());

        allLetters += letter;

        for (animal in animals) {
            if(allLetters.endsWith(animal)) say(animals[animal]);
        }

        if (letter=="=") {
            var answer = doSums(allLetters);
            if (answer!=null && answer!=undefined) {
                letter += answer;
                say(answer);
            }
        }

        keyheld = true;

        truncate();
    }

    function doSums(allLetters) {
        var pos = allLetters.length - 2;
        var sum = ""
        var found_start_of_sum = false
        while(!found_start_of_sum) {
            var onChar = allLetters[pos];
            if (onChar=="÷") onChar="/";
            if (onChar=="x") onChar="*";

            if (onChar.match(/[+-/*0123456789]/i)) {
                sum = onChar + sum;
            } else {
                found_start_of_sum = true;
            }
            if (pos==0) found_start_of_sum = true;
            pos -= 1;
        }
        return eval(sum);
    }

    function drawColourfulText(text) {
        var elem = document.createElement("span");
        elem.setAttribute("class", "letter");
        elem.textContent = text;
        elem.style.position = "absolute";

        document.body.appendChild(elem);
        var x = Math.round(Math.random() * (window.innerWidth - elem.clientWidth));
        var y = Math.round(Math.random() * (window.innerHeight - (elem.clientHeight - 100))) - 70;

        elem.style.left = x + "px";
        elem.style.top = y + "px";
        elem.style.color = randomLightColour(); //colours[Math.floor(Math.random()*colours.length)];
        allElements.push(elem);
    }

    document.onclick = function() {
        if (allLetters=='') allLetters='@'; // before start of the alphabet
        lastLetter = allLetters[allLetters.length -1];
        nextLetter = String.fromCharCode(lastLetter.charCodeAt(0) + 1)
        if (lastLetter == 'Z') {
            say('alphabet!');
            allLetters = '';
        } else if (lastLetter == '9') {
            doLetter('10');
        } else {
            doLetter(nextLetter);
        }
    };

    function truncate() {
        var maxLenParam = getParameterByName('maxlen');
        if (maxLenParam == null) return;
        var maxLength = parseInt(maxLenParam || '50');
        if (maxLength < 1) return;
        if (mode=='words') maxLength = maxLength * 2;

        // Clean up so that there are only a certain amount of letters on screen.
        while (allElements.length > maxLength) {
            var removed = allElements.shift();
            document.body.removeChild(removed);
        }
        if (allLetters.length > allElements.length) {
            allLetters = allLetters.substring(allLetters.length - allElements.length);
        }
    }

    function say(text) {
        if (getParameterByName('voice') != 'None') {
            var utterance = new SpeechSynthesisUtterance(text);
            if (voice==null) voice=setVoice();
            if (voice!=null) utterance.voice = voice
            window.speechSynthesis.speak(utterance);
        }
    }

    function showEmoji(emoji, label) {
        if (!emoji) return;
        // Fill panels in sequence: left (0) -> middle (1) -> right (2),
        // then the next one replaces the leftmost again (cycling).
        var panel = document.getElementById('panel' + panelIndex);
        panel.innerHTML = "<span class='emoji'>" + emoji + "</span>" +
                          "<span class='label'>" + label + "</span>";
        panelIndex = (panelIndex + 1) % 3;
    }

    function setVoice() {
        var langParam = getParameterByName('lang');
        var voiceName = getParameterByName('voice');
        var lang = langParam
        if (langParam==null && voiceName==null) {
            //Get browser langauge
            lang = navigator.languages ? navigator.languages[0] : (navigator.language || navigator.userLanguage)
        }

        if (lang!==null) lang=lang.toLowerCase();

        voices = window.speechSynthesis.getVoices();
        var found = null;
        var availableLangs = [];
        var voicesByName = {};
        for (var i=0; i<voices.length; i++) {
            var v = voices[i];
            if (availableLangs.indexOf(v.lang) == -1) availableLangs.push(v.lang);
            voicesByName[v.name] = v.lang;
            if (found == null) {
                if (v.name==voiceName) found = v;
                if (v.lang.toLowerCase()==lang) found = v;
            }
        }
        if (voiceName=='None') {
            updateVoiceChoice(voicesByName, 'None');
            return null;
        }
        if (found==null) {
            if (window.langParameter && lang!=null) {
                alert('No voice for lang ' + lang + "\n\n" +
                      'Available langs: ' + availableLangs.join());
            }
            if (voiceName!=null) alert('No voice for with name ' + voiceName);
            found = voices[0];
        }

        updateVoiceChoice(voicesByName, found.name);
        return found;

    }

    function updateVoiceChoice(voicesByName, selectedName) {
        elem = document.getElementById('voicePicker');

        names = Object.keys(voicesByName);
        names.push('None');

        optionTags  = '';
        for (var i=0; i<names.length; i++) {
            sel = '';
            if (names[i]==selectedName) sel='selected';
            optionTags += '<option value="' + names[i] + '" ' + sel + '>' + names[i] + '</option>';
        }
        elem.innerHTML = optionTags;
    }

    function voicePicked(elem) {
        reloadSettings();
    }

    function modePicked(elem) {
        mode = elem.value;
        reloadSettings();
    }

    function reloadSettings() {
        var voiceName = document.getElementById('voicePicker').value;
        window.location = "?mode=" + mode + "&voice=" + encodeURI(voiceName);
    }

    function initMode() {
        mode = getParameterByName('mode');
        if (mode==null) mode = 'letter-is-for-word';
        document.getElementById('modePicker').value = mode;
    }

    function preloadImage (url) {
        try {
            var elem = document.createElement("span");
            elem.setAttribute("class", "image");
            elem.innerHTML = "<img src='" + url + "'>";
        } catch (e) { }
    }

    function randomLightColour() {
        var hue = Math.random() * 360;
        var saturation = 100;
        var varience = 50;
        return 'hsl(' + hue + ', ' + saturation + '%, ' + varience + '%)';
    }

    // http://stackoverflow.com/a/901144/338265
    function getParameterByName(name) {
        var url = window.location.href;
        name = name.replace(/[\[\]]/g, "\\$&");
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, " "));
    }
  </script>
</html>
<body onLoad="init();">

<div id="settingsPanel">
  <label for="voicePicker">Voice:</label>
  <select id="voicePicker" onChange="voicePicked(this);">
    <option value="Alex">Alex</option>
    <option value="None">None</option>
  </select>

  <label for="modePicker">Mode:</label>
  <select id="modePicker" onChange="modePicked(this);">
    <option value="letter-is-for-word">letter is for word</option>
    <option value="letters">letters</option>
    <option value="words">words</option>
  </select>
</div>

<div id="instructions">
   If you are a baby, whack your keyboard randomly now
</div>

<div id="panels">
  <div class="panel" id="panel0"></div>
  <div class="panel" id="panel1"></div>
  <div class="panel" id="panel2"></div>
</div>

<div id="infoAndCredits">
   (<a href="//harrywood.co.uk/blog/2016/09/10/keyboard-letters-game/" title="Blog post about this">About</a>)
   <span id="credits">
   </span>
</div>
</body>
</html>
